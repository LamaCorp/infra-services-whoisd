---
name: Main

permissions:
  contents: read

"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: latest
          args: --timeout 5000s --verbose
          skip-cache: true
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - run: make build-all
  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - run: make test
  test-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - run: sudo apt install -y whois
      - run: make build
      - run: |
          WHOISD_LISTEN=:10043 WHOISD_LOG_LEVEL=debug ./whoisd &
          sleep 1
          whois -h localhost -p 10043 example.com
  build-container:
    runs-on: ubuntu-latest
    permissions:
      # Needed to upload container images to ghcr.io
      packages: write
      # Needed for attestation
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: |
          github.repository == 'LamaCorp/whoisd' &&
            (github.event_name != 'pull_request' ||
             github.event.pull_request.head.repo.full_name == github.repository)
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: push
        with:
          file: Dockerfile
          context: .
          build-args: |
            VERSION=${{ github.event.pull_request.head.sha }}
            COMMIT=${{ github.event.pull_request.head.sha }}
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/lamacorp/whoisd-dev:${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          push: |
            ${{ github.repository == 'LamaCorp/whoisd' &&
              (github.event_name != 'pull_request' ||
              github.event.pull_request.head.repo.full_name == github.repository) }}
          cache-from: type=registry,ref=ghcr.io/lamacorp/whoisd-dev:buildcache
          cache-to: |
            ${{ (github.repository == 'LamaCorp/whoisd' &&
                (github.event_name != 'pull_request' ||
                  github.event.pull_request.head.repo.full_name == github.repository))
                && 'type=registry,ref=ghcr.io/lamacorp/whoisd-dev:buildcache,mode=max'
                || ''
            }}
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        id: attest
        if: |
          github.repository == 'LamaCorp/whoisd' &&
            (github.event_name != 'pull_request' ||
             github.event.pull_request.head.repo.full_name == github.repository)
        with:
          subject-name: ghcr.io/lamacorp/whoisd-dev
          subject-digest: "${{ steps.push.outputs.digest }}"
          push-to-registry: true
  ci-main-mark:
    if: always()
    needs:
      - lint
      - build
      - test-unit
      - test-integration
      - build-container
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # release/v1
        with:
          jobs: ${{ toJSON(needs) }}
