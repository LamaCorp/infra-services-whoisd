---
name: Release

"on":
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.2.3). Do not prefix with a `v`"
        required: true
        type: string

jobs:
  binaries:
    permissions:
      # Needed for attestation
      id-token: write
      attestations: write
      artifact-metadata: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: 386 }
          - { goos: linux, goarch: arm, goarm: "6" }
          - { goos: linux, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: 386 }
          - { goos: windows, goarch: arm, goarm: "6" }
          - { goos: windows, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: freebsd, goarch: amd64 }
          - { goos: freebsd, goarch: 386 }
          - { goos: freebsd, goarch: arm, goarm: "6" }
          - { goos: freebsd, goarch: arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - id: names
        shell: bash
        run: |
          BINARY_NAME=whoisd
          ARCHIVE_NAME="${BINARY_NAME}-v${{ inputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            echo "binary=${BINARY_NAME}.exe" >> "$GITHUB_OUTPUT"
            echo "archive=${ARCHIVE_NAME}.zip" >> "$GITHUB_OUTPUT"
          else
            echo "binary=${BINARY_NAME}" >> "$GITHUB_OUTPUT"
            echo "archive=${ARCHIVE_NAME}.tar.gz" >> "$GITHUB_OUTPUT"
          fi
      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: "0"
        run: |
          go build \
            -trimpath \
            -ldflags="-s -w -X main.version=v${{ inputs.version }} -X main.commit=${{ github.sha }}" \
            -o dist/${{ steps.names.outputs.binary }} \
            ./...
      - name: archive
        if: "matrix.goos != 'windows'"
        run: tar -czf dist/${{ steps.names.outputs.archive }} -C dist ${{ steps.names.outputs.binary }}
      - name: archive
        if: "matrix.goos == 'windows'"
        run: cd dist && zip ${{ steps.names.outputs.archive }} ${{ steps.names.outputs.binary }}
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/${{ steps.names.outputs.archive }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.names.outputs.archive }}
          path: dist/${{ steps.names.outputs.archive }}
          if-no-files-found: error
          retention-days: 7
  container:
    runs-on: ubuntu-latest
    permissions:
      # Needed to upload container images to ghcr.io
      packages: write
      # Needed for attestation
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: push
        with:
          file: Dockerfile
          context: .
          build-args: |
            VERSION=${{ inputs.version }}
            COMMIT=${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/lamacorp/whoisd:v${{ inputs.version }}
          push: true
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        id: attest
        with:
          subject-name: ghcr.io/lamacorp/whoisd
          subject-digest: "${{ steps.push.outputs.digest }}"
          push-to-registry: true
  release:
    runs-on: ubuntu-latest
    permissions:
      # Needed to create the release
      contents: write
    needs:
      - binaries
      - container
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - working-directory: dist
        run: |
          rm *.dockerbuild
          sha256sum * > checksums.txt
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          target_commitish: ${{ github.sha }}
          tag_name: v${{ inputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/**
            LICENSE
